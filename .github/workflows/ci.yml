name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: agent-skills-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check the skills index is up to date
        run: python3 scripts/build_skills_index.py --check
